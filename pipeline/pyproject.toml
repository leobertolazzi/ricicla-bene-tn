[project]
name = "ricicla-bene-tn-pipeline"
version = "0.2.0"
description = "Offline scraping, MobileCLIP2-S0 text embedding generation, and CoreML export for Ricicla Bene TN"
requires-python = ">=3.11,<3.14"
dependencies = [
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "open-clip-torch>=3.0.0",
    "timm>=1.0.15",
    "onnx>=1.17.0",
    "onnxscript>=0.2.0",
    "onnxruntime>=1.20.0",
    "huggingface-hub>=0.25.0",
    "transformers>=4.45.0",
    "pillow>=10.0.0",
    "numpy>=1.26.0",
]
