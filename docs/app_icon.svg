<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="trentinoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#004C70" />
      <stop offset="52%" stop-color="#006390" />
      <stop offset="100%" stop-color="#008AB0" />
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="46%" r="48%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#006390" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A3E635" />
      <stop offset="100%" stop-color="#65A30D" />
    </linearGradient>
  </defs>

  <!-- Full-bleed Trentino background (cropped automatically by iOS Home Screen & maskable icons) -->
  <rect width="1024" height="1024" fill="url(#trentinoBg)" />
  <rect width="1024" height="1024" fill="url(#centerGlow)" />

  <!-- Subtle Dolomites silhouette along the bottom -->
  <path d="M0 1024 L0 790 L140 675 L255 745 L410 615 L560 730 L725 630 L885 745 L1024 670 L1024 1024 Z" fill="#FFFFFF" fill-opacity="0.075" />
  <path d="M0 1024 L0 855 L190 770 L350 845 L530 740 L690 855 L865 775 L1024 835 L1024 1024 Z" fill="#FFFFFF" fill-opacity="0.06" />

  <!-- Minimalist 3-arc rounded recycling emblem centered in the 62% safe zone -->
  <g transform="translate(512, 502)" fill="none" stroke="#FFFFFF" stroke-width="50" stroke-linecap="round" stroke-linejoin="round">
    <!-- Arc 1 (Top-Right): from -72 deg to 28 deg on r=224 -->
    <g transform="rotate(0)">
      <path d="M 69 -213 A 224 224 0 0 1 215 62" />
      <path d="M 162 34 L 215 68 L 245 11" />
    </g>
    <!-- Arc 2 (Bottom): rotated 120 deg -->
    <g transform="rotate(120)">
      <path d="M 69 -213 A 224 224 0 0 1 215 62" />
      <path d="M 162 34 L 215 68 L 245 11" />
    </g>
    <!-- Arc 3 (Top-Left): rotated 240 deg -->
    <g transform="rotate(240)">
      <path d="M 69 -213 A 224 224 0 0 1 215 62" />
      <path d="M 162 34 L 215 68 L 245 11" />
    </g>
  </g>

  <!-- Central Trentino alpine green leaf accent -->
  <g transform="translate(512, 502)">
    <path d="M -52 48 C -56 -22, 6 -66, 66 -62 C 68 -4, 24 58, -52 48 Z" fill="url(#leafGrad)" />
    <path d="M -34 32 C -10 10, 18 -14, 44 -38" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" stroke-opacity="0.9" />
  </g>
</svg>
