    <g transform="translate(155, 106)" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12.5 3h-5L6 5.5H3.5A1.5 1.5 0 0 0 2 7v8a1.5 1.5 0 0 0 1.5 1.5h13A1.5 1.5 0 0 0 18 15V7a1.5 1.5 0 0 0-1.5-1.5H14L12.5 3Z" />
