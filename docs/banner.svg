    </text>

    <!-- Trento bin color pills -->
    <g transform="translate(0, 198)">
      <rect x="0" y="0" width="84" height="28" rx="14" fill="#F4C430" />
      <text x="42" y="19" text-anchor="middle" fill="#1B2024" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">Carta</text>

      <rect x="94" y="0" width="112" height="28" rx="14" fill="#0284C7" />
      <text x="150" y="19" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">Imb. Leggeri</text>

      <rect x="216" y="0" width="92" height="28" rx="14" fill="#7B4F2C" />
      <text x="262" y="19" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">Organico</text>

      <rect x="318" y="0" width="76" height="28" rx="14" fill="#78C850" />
      <text x="356" y="19" text-anchor="middle" fill="#13260D" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">Vetro</text>

      <rect x="404" y="0" width="84" height="28" rx="14" fill="#1B4D3E" />
      <text x="446" y="19" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">Residuo</text>
