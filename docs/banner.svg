    <text x="34" y="205" fill="#2BA5DC" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="700" letter-spacing="0.4">★ MIGLIORE</text>
    <rect x="34" y="213" width="24" height="24" rx="7" fill="#0284C7" />
    <text x="46" y="229" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="700">#1</text>
    <text x="66" y="224" fill="#EEF5F9" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="700">Bottiglie in plastica</text>
    <rect x="66" y="231" width="128" height="17" rx="8.5" fill="#0284C7" />
    <text x="130" y="243" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="8.8" font-weight="700">IMBALLAGGI LEGGERI</text>
    <text x="294" y="224" text-anchor="end" fill="#EEF5F9" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">34%</text>
