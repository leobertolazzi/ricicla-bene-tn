    <rect x="22" y="282" width="286" height="54" rx="14" fill="#131F28" stroke="#223544" stroke-width="1" />
    <rect x="34" y="295" width="22" height="22" rx="6" fill="#1E303E" />
    <text x="45" y="309" text-anchor="middle" fill="#98ABB9" font-family="-apple-system, sans-serif" font-size="9" font-weight="700">#2</text>
    <text x="64" y="306" fill="#EEF5F9" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">Flaconi in plastica</text>
    <rect x="64" y="313" width="124" height="16" rx="8" fill="#0284C7" />
    <text x="126" y="324" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="700">IMBALLAGGI LEGGERI</text>
    <text x="294" y="307" text-anchor="end" fill="#98ABB9" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="700">21%</text>
