<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Ricicla Bene TN — Trentino offline recycling PWA">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#004C70" />
      <stop offset="55%" stop-color="#006390" />
      <stop offset="100%" stop-color="#0082A4" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#142029" />
      <stop offset="100%" stop-color="#0C141A" />
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#041824" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" rx="24" fill="url(#bgGrad)" />

  <!-- Subtle Dolomites mountain silhouette -->
  <path d="M0 420 L0 310 L130 225 L230 285 L360 175 L495 270 L640 190 L790 295 L930 230 L1080 300 L1200 245 L1200 420 Z" fill="#ffffff" fill-opacity="0.06" />
  <path d="M0 420 L0 345 L180 275 L310 330 L480 250 L620 335 L820 270 L1010 340 L1200 285 L1200 420 Z" fill="#ffffff" fill-opacity="0.05" />

  <!-- Left Content -->
  <g transform="translate(64, 72)">
