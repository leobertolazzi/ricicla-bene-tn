    <g transform="translate(145, 101)" fill="none" stroke="#259ED4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 12V7a3 3 0 0 1 3-3h5M28 4h5a3 3 0 0 1 3 3v5M36 28v5a3 3 0 0 1-3 3h-5M12 36H7a3 3 0 0 1-3-3v-5" />
