<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Ricicla Bene TN — Trentino offline recycling PWA">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#004C70" />
      <stop offset="55%" stop-color="#006390" />
      <stop offset="100%" stop-color="#0082A4" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F1922" />
      <stop offset="100%" stop-color="#0B1218" />
