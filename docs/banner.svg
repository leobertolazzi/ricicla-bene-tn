      <text x="42" y="19" text-anchor="middle" fill="#1B2024" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">Carta</text>

      <rect x="94" y="0" width="112" height="28" rx="14" fill="#0284C7" />
      <text x="150" y="19" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">Imb. Leggeri</text>

