    <rect x="242" y="42" width="64" height="22" rx="11" fill="#259ED4" fill-opacity="0.22" />
    <text x="274" y="57" text-anchor="middle" fill="#6EC6EE" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">Trento</text>

    <!-- Viewfinder box -->
