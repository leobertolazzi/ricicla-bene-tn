    </g>
    <text x="165" y="164" text-anchor="middle" fill="#97AAB8" font-family="-apple-system, sans-serif" font-size="11">100% On-Device SigLIP 2 · IT + EN</text>

    <!-- Result #1 -->
    <rect x="24" y="196" width="282" height="64" rx="14" fill="#182733" stroke="#0284C7" stroke-width="1.5" />
    <circle cx="44" cy="218" r="11" fill="#0284C7" />
    <text x="44" y="222" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="10" font-weight="700">#1</text>
    <text x="64" y="220" fill="#EEF5F9" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">Bottiglie in plastica</text>
    <rect x="64" y="228" width="132" height="18" rx="9" fill="#0284C7" />
    <text x="130" y="241" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="700">IMBALLAGGI LEGGERI</text>
    <text x="290" y="222" text-anchor="end" fill="#97AAB8" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">34%</text>

    <!-- Result #2 -->
    <rect x="24" y="268" width="282" height="58" rx="14" fill="#182733" stroke="#253746" />
    <circle cx="44" cy="290" r="11" fill="#243746" />
    <text x="44" y="294" text-anchor="middle" fill="#97AAB8" font-family="-apple-system, sans-serif" font-size="10" font-weight="700">#2</text>
    <text x="64" y="292" fill="#EEF5F9" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="600">Flaconi in plastica</text>
    <rect x="64" y="300" width="132" height="18" rx="9" fill="#0284C7" />
    <text x="130" y="313" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="700">IMBALLAGGI LEGGERI</text>
    <text x="290" y="294" text-anchor="end" fill="#97AAB8" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">21%</text>
