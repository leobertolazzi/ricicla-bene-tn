    <rect x="0" y="0" width="248" height="32" rx="16" fill="#83B81A" fill-opacity="0.22" stroke="#83B81A" stroke-opacity="0.7" />
    <circle cx="18" cy="16" r="5" fill="#83B81A" />
    <text x="32" y="21" fill="#EBF7D3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">
